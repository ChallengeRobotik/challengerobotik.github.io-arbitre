<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accès Arbitrage - Challenge Robotik</title>
    <link rel="icon" type="image/png" href="https://image.noelshack.com/fichiers/2026/21/3/1779300174-homologation-1.png
">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --accent: #ffffff; --bg: #000000; --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08); --text-main: #ffffff; --text-mute: #888888;
            --blue: #3b82f6; --green: #10b981; --red: #ff4b4b; --input-bg: #1a1a1a;
            --accent-glow: rgba(255, 255, 255, 0.05);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; outline: none; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            min-height: 100vh; 
            overflow-x: hidden; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            position: relative;
        }

        #bg-canvas { 
            position: fixed; 
            inset: 0; 
            z-index: 1; 
            pointer-events: none;
            opacity: 0.4;
        }

        /* Countdown Timer Interface */
        .countdown-container {
            position: relative;
            z-index: 10;
            margin-bottom: 30px;
            text-align: center;
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .countdown-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-mute);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .countdown {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .countdown-item {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 14px;
            min-width: 75px;
            transition: 0.3s;
        }
        
        .countdown-item:hover {
            border-color: var(--text-mute);
        }

        .countdown-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .countdown-unit {
            font-size: 10px;
            color: var(--text-mute);
            text-transform: uppercase;
            font-weight: 500;
            margin-top: 2px;
        }

        /* Main Login Card - Glassmorphism style matching index.html */
        .login-card {
            position: relative;
            z-index: 10;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .logo { 
            width: 80px; 
            height: auto;
            margin-bottom: 20px; 
            transition: transform 0.4s ease;
        }
        .logo:hover {
            transform: scale(1.05);
        }
        
        h1 { 
            font-size: 24px; 
            font-weight: 700; 
            margin-bottom: 6px; 
            color: var(--text-main);
        }
        
        p { color: var(--text-mute); font-size: 14px; margin-bottom: 30px; font-weight: 400; }

        .input-group { position: relative; margin-bottom: 15px; }
        
        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 14px 18px;
            padding-right: 50px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            transition: 0.2s;
        }
        input:focus { 
            border-color: var(--text-mute);
        }
        input::placeholder { color: #555555; }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-mute);
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            background: none;
            border: none;
            padding: 6px;
        }
        .toggle-password:hover { color: var(--text-main); }

        .btn-submit {
            width: 100%;
            background: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-submit:hover { 
            opacity: 0.9;
        }

        .error-msg {
            color: var(--red);
            background: rgba(255, 75, 75, 0.1);
            border: 1px solid rgba(255, 75, 75, 0.2);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="countdown-container">
        <div class="countdown-label">Lancement du challenge</div>
        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <div class="countdown-value" id="days">00</div>
                <div class="countdown-unit">Jours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="hours">00</div>
                <div class="countdown-unit">Heures</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="minutes">00</div>
                <div class="countdown-unit">Min</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="seconds">00</div>
                <div class="countdown-unit">Sec</div>
            </div>
        </div>
    </div>

    <div class="login-card">
        <img src="https://image.noelshack.com/fichiers/2026/21/3/1779300174-homologation-1.png
" class="logo" alt="Logo Challenge Robotik">
        <h1>Challenge Robotik</h1>
        <p>Espace sécurisé pour les arbitres</p>

        <div class="error-msg" id="error-msg">Identifiants incorrects.</div>

        <form id="login-form">
            <div class="input-group">
                <input type="text" id="login-id" placeholder="Identifiant" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Mot de passe" required autocomplete="current-password">
                <button type="button" class="toggle-password" id="toggle-password" aria-label="Afficher le mot de passe">
                    <i data-lucide="eye"></i>
                </button>
            </div>
            <button type="submit" class="btn-submit">
                <span>Se connecter</span>
                <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCayfDcG1_UgtucU1sExenPfcXozBL2HoQ",
            authDomain: "challengerobotik.firebaseapp.com",
            databaseURL: "https://challengerobotik-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "challengerobotik",
            storageBucket: "challengerobotik.firebasestorage.app",
            messagingSenderId: "414754555947",
            appId: "1:414754555947:web:8021bb3d33e2b7fd37026e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const REDIRECT_URL = "index.html";

        // Initialisation de Lucide
        lucide.createIcons();

        // Gestion de l'affichage du mot de passe
        const togglePassBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('login-password');
        
        togglePassBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassBtn.innerHTML = isPassword ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
            lucide.createIcons();
        });

        // Animation de fond en Canvas
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * -0.3 - 0.1;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // Compte à rebours
        const targetDate = new Date("2026-05-21T08:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Connexion & Firebase Auth Logique
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const id = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-password').value;
            const errorEl = document.getElementById('error-msg');
            
            errorEl.style.display = 'none';

            onValue(ref(db, 'arbiters'), (snap) => {
                const admin1 = {"id":"MrFr_G8mC","pass":"Fc-01061970","name":"Mr FRAMBOURT"};
                const admin2 = {"id":"Milandris","pass":"Milandris2026","name":"Milandris"};
                const data = snap.val();
                
                let users = [admin1, admin2];
                if(data) {
                    users = [admin1, admin2, ...Object.values(data)];
                }
                
                const user = users.find(x => x.id === id && x.pass === pass);

                if(user) {
                    if(user.suspended && user.id !== 'MrFr_G8mC' && user.id !== 'Milandris') {
                        errorEl.innerText = "Ce compte est suspendu.";
                        errorEl.style.display = 'block';
                        return;
                    }
                    localStorage.setItem('persistent_session', JSON.stringify(user));
                    window.location.href = REDIRECT_URL;
                } else {
                    errorEl.innerText = "Identifiants incorrects ou accès restreint.";
                    errorEl.style.display = 'block';
                }
            }, { onlyOnce: true });
        });
    </script>
</body>
</html>
